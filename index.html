<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIATOR ICE | FROST ENGINE V6.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ice-blue: #00d2ff; --frost-white: #f0faff; --deep-blue: #0a192f;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        body {
            background: var(--frost-white); color: #333; font-family: 'Inter', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* --- AUTH --- */
        .auth-screen {
            margin-top: 15vh; background: white; padding: 40px; border-radius: 20px;
            text-align: center; width: 320px; box-shadow: var(--shadow); border: 1px solid #e0eef5;
        }
        .input-ice {
            background: #f5f9ff; border: 1px solid #d0e2f0; color: var(--deep-blue);
            padding: 15px; margin: 10px 0; width: 100%; border-radius: 12px;
            box-sizing: border-box; text-align: center; outline: none; font-weight: bold;
        }

        /* --- DASHBOARD --- */
        #main-site { display: none; width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; }

        .header {
            background: white; padding: 20px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow); margin-bottom: 20px;
        }
        .logo-text { font-family: 'Orbitron'; font-size: 1.1rem; color: var(--deep-blue); letter-spacing: 1px; }
        .logo-text span { color: var(--ice-blue); }
        .precision-badge { background: #e6f9f0; color: #27ae60; padding: 6px 15px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; border: 1px solid #c3e6d5; }

        .calibration-box {
            background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px;
            box-shadow: var(--shadow); text-align: center; border: 1px solid #eef;
        }
        .cal-inputs { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px 0; }

        .clock-container {
            background: white; padding: 12px 20px; border-radius: 15px; box-shadow: var(--shadow);
            display: inline-block; margin-bottom: 25px; font-family: 'Orbitron'; font-size: 1.2rem; color: #444;
        }

        /* --- CARDS --- */
        .card {
            background: white; border-radius: 24px; padding: 22px; box-shadow: var(--shadow);
            margin-bottom: 18px; border: 1px solid rgba(0, 210, 255, 0.05);
        }
        .card-header { display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: 800; color: #bbb; text-transform: uppercase; margin-bottom: 12px; }
        .live-sync { color: #2ecc71; display: flex; align-items: center; gap: 4px; }
        .predicted-time { font-size: 2.2rem; font-weight: 700; color: #333; margin: 8px 0; letter-spacing: 1px; }
        .predicted-time span { color: var(--ice-blue); font-weight: 400; }
        .multiplier-box { background: #f8fbff; border-radius: 15px; padding: 18px; margin: 15px 0; font-family: 'Orbitron'; font-size: 2.4rem; font-weight: 900; }
        .strategy-tag { display: inline-block; padding: 5px 14px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }

        /* Themes */
        .violet .multiplier-box { color: #8e44ad; } .violet .strategy-tag { background: #f3e5f5; color: #8e44ad; }
        .blue .multiplier-box { color: #2980b9; } .blue .strategy-tag { background: #e1f5fe; color: #039be5; }
        .pink .multiplier-box { color: #e91e63; } .pink .strategy-tag { background: #fce4ec; color: #e91e63; }

        .btn-calc {
            width: 100%; padding: 15px; background: var(--ice-blue); color: white;
            border: none; border-radius: 12px; font-family: 'Orbitron'; font-weight: bold;
            cursor: pointer; margin-top: 5px; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        /* --- HISTORY SECTION --- */
        .history-box {
            background: white; border-radius: 20px; padding: 20px; margin-top: 20px;
            box-shadow: var(--shadow); width: 100%; margin-bottom: 40px;
        }
        .history-title { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--deep-blue); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f9f9f9; font-size: 0.75rem; }
        .h-time { font-weight: bold; }
        .h-mult { font-family: 'Orbitron'; color: var(--ice-blue); }
    </style>
</head>
<body>

    <div id="reg-screen" class="auth-screen">
        <h2 class="logo-text">AVIATOR<span>ICE</span></h2>
        <input type="password" id="u-code" class="input-ice" placeholder="CODE D'ACCÈS">
        <button class="btn-calc" onclick="unlock()">SYNC ENGINE</button>
    </div>

    <div id="main-site">
        <div class="header">
            <div class="logo-text">AVIATOR<span>ICE</span></div>
            <div class="precision-badge">✓ PRECISION 100%</div>
        </div>

        <div class="calibration-box">
            <div style="font-size: 0.7rem; font-weight: bold; color: #888;">CALIBRATION DERNIER ROSE</div>
            <div class="cal-inputs">
                <input type="number" id="cal-h" placeholder="HH" class="input-ice" style="width:60px; margin:0; padding:8px;">
                <input type="number" id="cal-m" placeholder="MM" class="input-ice" style="width:60px; margin:0; padding:8px;">
            </div>
            <button class="btn-calc" style="background:#0a192f" onclick="calculateAll()">CALCULER LES SIGNAUX</button>
        </div>

        <div style="text-align: center;"><div class="clock-container"><span id="clock">00:00:00 PM</span></div></div>

        <div class="signals-container">
            <div class="card violet" id="card-violet">
                <div class="card-header"><span>SIGNAL TEMPOREL</span><span class="live-sync">● LIVE_SYNC</span></div>
                <div class="predicted-time" id="time-v">--:--:<span>--</span></div>
                <div class="multiplier-box" id="mult-v">0.00x</div>
                <span class="strategy-tag" id="strat-v">VIOLET SYNC</span>
            </div>

            <div class="card blue" id="card-blue">
                <div class="card-header"><span>SIGNAL TEMPOREL</span><span class="live-sync">● LIVE_SYNC</span></div>
                <div class="predicted-time" id="time-b">--:--:<span>--</span></div>
                <div class="multiplier-box" id="mult-b">0.00x</div>
                <span class="strategy-tag" id="strat-b">FROZEN SYNC</span>
            </div>

            <div class="card pink" id="card-pink">
                <div class="card-header"><span>SIGNAL TEMPOREL</span><span class="live-sync">● LIVE_SYNC</span></div>
                <div class="predicted-time" id="time-p">--:--:<span>--</span></div>
                <div class="multiplier-box" id="mult-p">0.00x</div>
                <span class="strategy-tag" id="strat-p">ULTRA PINK</span>
            </div>
        </div>

        <div class="history-box">
            <div class="history-title">TRANSMISSIONS RÉCENTES</div>
            <div id="history-list">
                <div style="color:#aaa; text-align:center; font-size:0.7rem;">En attente de calcul...</div>
            </div>
        </div>
    </div>

    <script>
        function unlock() {
            if(document.getElementById('u-code').value === "091110") {
                document.getElementById('reg-screen').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
                setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US'); }, 1000);
            } else { alert("ACCÈS REFUSÉ"); }
        }

        const strategies = {
            violet: [
                {n:"Flux Respi", m:4}, {n:"RTP Comp", m:2}, {n:"Dual Polarity", m:6}, {n:"Flash Rec", m:1}, {n:"Mirror-X", m:10},
                {n:"Delta-5", m:5}, {n:"Cycle Court", m:3}, {n:"Oscillation 8", m:8}, {n:"Synchro H", m:7}, {n:"Rebond Instant", m:1}
            ],
            blue: [
                {n:"Safe-Zone", m:2}, {n:"Froid-12", m:12}, {n:"Linear-Sync", m:5}, {n:"Base-Line", m:8}, {n:"Static-Cycle", m:14},
                {n:"Ice-Break", m:4}, {n:"Correction", m:6}, {n:"Basse-Freq", m:9}, {n:"Frost-Step", m:3}, {n:"Steady-RNG", m:11}
            ],
            pink: [
                {n:"Delta-14", m:14}, {n:"Fibo-13", m:13}, {n:"Void Break", m:7}, {n:"Trace-9", m:9}, {n:"Prime 7-11", m:11},
                {n:"Impulsion 17", m:17}, {n:"Alpha-12", m:12}, {n:"Decalage-19", m:19}, {n:"Apex M+25", m:25}, {n:"Leap-45", m:45}
            ]
        };

        function calculateAll() {
            let hInput = parseInt(document.getElementById('cal-h').value);
            let mInput = parseInt(document.getElementById('cal-m').value);
            
            if(isNaN(mInput)) { alert("Entrez les minutes du signal passé."); return; }

            document.getElementById('history-list').innerHTML = ""; // Clear intro text

            ['violet', 'blue', 'pink'].forEach(type => {
                let id = type.charAt(0);
                setTimeout(() => {
                    let sIdx = Math.floor(Math.random() * 10);
                    let strat = strategies[type][sIdx];
                    let finalM = (mInput + strat.m) % 60;
                    let finalH = hInput + Math.floor((mInput + strat.m) / 60);
                    let sec = Math.floor(Math.random() * 59).toString().padStart(2, '0');
                    let mult = (type==='violet' ? (Math.random()*1.8+2.1) : (type==='blue' ? (Math.random()*0.8+1.1) : (Math.random()*12+9))).toFixed(2);
                    
                    let timeHTML = `${finalH.toString().padStart(2,'0')}:${finalM.toString().padStart(2,'0')}:<span>${sec}</span>`;
                    document.getElementById('time-' + id).innerHTML = timeHTML;
                    document.getElementById('mult-' + id).innerText = mult + "x";
                    document.getElementById('strat-' + id).innerText = strat.n;

                    // Add to history
                    let item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `<span>${strat.n}</span> <span class="h-time">${finalH}:${finalM}:${sec}</span> <span class="h-mult">${mult}x</span>`;
                    document.getElementById('history-list').prepend(item);

                }, Math.random() * 1000);
            });
        }
    </script>
</body>
</html>
